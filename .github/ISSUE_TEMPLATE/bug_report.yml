name: Bug report
description: Report an SDK defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste** API keys, native session tokens, Authorization headers, or Apple Pay `paymentData` / signatures.
  - type: input
    id: sdk_version
    attributes:
      label: SDK version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: commit_tag
    attributes:
      label: Commit or tag
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device (Simulator / model)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - production (merchant.venpays.com)
        - custom URL
        - local test double
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens and payment payloads before pasting.
    validations:
      required: false
  - type: input
    id: error_code
    attributes:
      label: VenPaysErrorCode (if any)
    validations:
      required: false
