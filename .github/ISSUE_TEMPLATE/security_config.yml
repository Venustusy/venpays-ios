name: Security advisory (do not use for secrets)
description: Redirects reporters to private security email
title: "[security] "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        ## Do not file security issues with secrets here

        This repository is **private** to [Venustusy](https://github.com/Venustusy)
        (`https://github.com/Venustusy/venpays-ios`).

        Report vulnerabilities privately to **security@venpays.com**.

        Include:
        - SDK version / commit
        - Impact assessment
        - Reproduction **without** embedding production secrets

        Never paste merchant `X-API-KEY`, native session tokens, or Apple Pay payment payloads into GitHub.
  - type: textarea
    id: non_sensitive_summary
    attributes:
      label: Non-sensitive summary
      description: High-level description only. No credentials or payment tokens.
    validations:
      required: true
