changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Testing
      labels:
        - test
        - testing
    - title: CI
      labels:
        - ci
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - maintenance
